# The replacement service beside the Django one.
#
# It joins the existing project and network so the two share the database and the
# broker, and it binds to the loopback address only: the host proxy decides what is
# public, exactly as it does for the old service.
name: noshiro-db

services:
  api-v2:
    image: "${API_V2_IMAGE:-noshiro-db/api-v2}:${API_V2_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-../api/.env.production}
    ports:
      - "127.0.0.1:${API_V2_PORT:-8010}:8010"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - noshiro_net

networks:
  noshiro_net:
    external: true
