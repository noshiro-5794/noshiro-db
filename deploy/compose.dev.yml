name: noshiro-db-dev

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: noshiro_db
      POSTGRES_USER: noshiro
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "noshiro", "-d", "noshiro_db"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres:/var/lib/postgresql

  redis:
    image: redis:7.4.10-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres:
