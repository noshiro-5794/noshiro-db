version: 2
updates:
  # GitHub uses the "npm" ecosystem identifier for npm, pnpm, and Yarn projects.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
