name: Web

on:
  # Unfiltered for pull requests so the required check is always reported; see
  # the note in api.yml. The push filter keeps merges cheap.
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/web.yml
  # Manual runs use the workflow file from the default branch and ignore the
  # push path filter, so a full run needs no dummy commit.
  workflow_dispatch:

# Read-only at the workflow level: the jobs only read the repository. The
# dependency-review job below narrows its own permissions further.
permissions:
  contents: read

# Keyed on the workflow as well as the ref: the API workflow running on the
# same ref must not be cancelled by this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  quality:
    # Distinct from the API workflow's job name so the branch rules can offer
    # one unambiguous check per app.
    name: web quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          # The lockfile and packageManager field live in apps/web, which the
          # action cannot discover from the repository root.
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser revision is a function of the @playwright/test version in
      # the lockfile, so the lockfile hash is the cache key. A miss costs the
      # download it always used to cost; a hit skips it.
      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run quality gates
        run: pnpm check

      - name: Audit production dependencies
        run: pnpm check:dependencies

# A dependency-review job was tried here and removed again: the action cannot run
# on this repository yet. It exits non-zero with "Dependency review is not
# supported on this repository. Please ensure that Dependency graph is enabled",
# and a job-level `continue-on-error` does not help because the check run is still
# reported as a failure — it would paint a red X on every pull request forever.
# Enable Settings > Advanced Security > Dependency graph and add
# actions/dependency-review-action (fail-on-severity: high, fail-on-scopes:
# runtime) back as a pull-request job.
