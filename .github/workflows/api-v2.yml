name: api-v2

on:
  push:
    branches: [main]
    paths:
      - "apps/api-v2/**"
      - ".github/workflows/api-v2.yml"
  pull_request:
    paths:
      - "apps/api-v2/**"
      - ".github/workflows/api-v2.yml"

concurrency:
  group: api-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-v2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      # A task registered under a name the old service never used is never consumed,
      # silently. The check is static, so it needs neither Django nor a database.
      - run: uv run python scripts/task_coverage.py
      # Routing and consumption are separate declarations; when they disagree the
      # message sits on the queue unread, which is how a task silently stops running.
      - run: uv run python scripts/queue_check.py
      - run: uv run pytest -q
