name: api-v2

on:
  push:
    branches: [main]
    paths:
      - "apps/api-v2/**"
      - ".github/workflows/api-v2.yml"
  pull_request:
    paths:
      - "apps/api-v2/**"
      - ".github/workflows/api-v2.yml"

concurrency:
  group: api-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-v2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts migrations
      - run: uv run ruff format --check src tests scripts migrations
      - run: uv run mypy
      # A task registered under a name the old service never used is never consumed,
      # silently. The check is static, so it needs neither Django nor a database.
      - run: uv run python scripts/task_coverage.py
      # Routing and consumption are separate declarations; when they disagree the
      # message sits on the queue unread, which is how a task silently stops running.
      - run: uv run python scripts/queue_check.py
      - run: uv run pytest -q

  schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-v2
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: migration-test
          POSTGRES_DB: noshiro_schema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:migration-test@127.0.0.1:5432/noshiro_schema_test
      NOSHIRO_INTEGRATION_DATABASE_URL: postgresql://postgres:migration-test@127.0.0.1:5432/noshiro_schema_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade 0001_baseline
      - run: uv run alembic upgrade head
      - run: uv run pytest -q tests/test_matching_transactions.py
