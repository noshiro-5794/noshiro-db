name: api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  pull_request:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: api quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts migrations
      - run: uv run ruff format --check src tests scripts migrations
      - run: uv run mypy
      - run: uv run python scripts/route_coverage.py
      # A task registered under a name the old service never used is never consumed,
      # silently. The static check reads the retained task contract.
      - run: uv run python scripts/task_coverage.py
      # Routing and consumption are separate declarations; when they disagree the
      # message sits on the queue unread, which is how a task silently stops running.
      - run: uv run python scripts/queue_check.py
      - run: uv run pytest -q

  schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: migration-test
          POSTGRES_DB: noshiro_schema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:migration-test@127.0.0.1:5432/noshiro_schema_test
      NOSHIRO_INTEGRATION_DATABASE_URL: postgresql://postgres:migration-test@127.0.0.1:5432/noshiro_schema_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
      - run: uv sync --locked
      - run: uv run alembic upgrade 0007_refresh_token_tables
      - run: uv run alembic downgrade 0001_baseline
      - run: uv run alembic upgrade head
      - run: uv run pytest -q tests/test_*transactions.py
