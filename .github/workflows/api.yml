name: API

on:
  # No path filter here on purpose: a required status check must be reported on
  # every pull request. A filtered workflow simply never runs for a PR that
  # touches other paths, and the check then waits forever, which blocks the
  # merge instead of protecting it. The push filter stays, so a merge only
  # re-runs the suite for the app it changed.
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - .github/workflows/api.yml

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  quality:
    # Distinct from the web workflow's job name: two workflows reporting the
    # same check name leave the branch rules with an ambiguous entry, and the
    # required-status-check picker offers nothing at all.
    name: api quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15.18-bookworm
        env:
          POSTGRES_DB: noshiro_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d noshiro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/noshiro_test
      UV_FROZEN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pinned to the version the project's `required-version` range
          # accepts. Left floating, the action installs whatever uv was
          # released last, and a new minor silently fails the whole job at
          # `uv sync` before a single test runs.
          version: "0.12.1"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run static and framework checks
        run: |
          uv run ruff check .
          uv run ruff format --check src tests
          DJANGO_SETTINGS_MODULE=config.settings.test uv run python src/manage.py check
          DJANGO_SETTINGS_MODULE=config.settings.test uv run python src/manage.py makemigrations --check --dry-run
          DJANGO_SETTINGS_MODULE=config.settings.test uv run python src/manage.py spectacular --validate --fail-on-warn

      - name: Run tests with coverage
        run: >-
          uv run pytest
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=60

      - name: Enforce changed-code coverage
        if: github.event_name == 'pull_request'
        run: |
          # The job runs for every pull request now, so a change that touches no
          # Python has nothing to measure and must not fail the check.
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^apps/api/.*\.py$'; then
            uv run diff-cover coverage.xml \
              --compare-branch="origin/${{ github.base_ref }}" \
              --fail-under=80
          else
            echo "No Python changes in this pull request; skipping changed-code coverage."
          fi

      - name: Audit Python dependencies
        run: uv run pip-audit --strict

  container:
    name: api image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          load: true
          push: false
          tags: noshiro-db/backend:ci

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: noshiro-db/backend:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library
